# UCI Concrete Compressive Strength regression — 1030 samples, 8 features,
# target is concrete strength in MPa (Yeh, 1998).
#
# Compose against the SONNConfig schema first (defaults filled in), then
# layer this tutorial's overrides on top via `_self_`.
defaults:
  - default
  - _self_

# Top-level flag (declared in SONNConfig); set true to resume training from
# the latest checkpoint in `train.checkpoint_dir`.
resume: false

# Hydra: keep auto-chdir disabled so the YAML's relative paths still resolve
# from the launch cwd rather than outputs/<date>/<time>/.
hydra:
  job:
    chdir: false

# --- Model -------------------------------------------------------------------
model:
  type: regressor
  # Concrete strength is known to depend on multiplicative interactions
  # (cement × age, water × superplasticizer, etc.) and an Abrams-law-style
  # ratio of cement to water. `linear_cov` captures pairwise products; the
  # `quadratic` family adds explicit x² terms for the age-vs-strength
  # nonlinearity (strength saturates, doesn't grow linearly with age).
  # Per-neuron-type activation: each entry below sets its own `activation`
  # in its options dict. Entries that omit `activation:` default to None →
  # `nn.Identity()`.
  ref_functions:
    - linear_cov:
        activation: ""
    - quadratic:
        activation: ""
    - cubic:
        activation: ""
    - polyquad:
        squares: True
        dim: 5
        activation: ""
  # Shortcut keeps the raw 8 inputs available to every layer — useful on a
  # small dataset where layer 0 might already discover the bulk of the
  # signal and layer 1 should be able to add residual terms over raw vars.
  shortcut: True
  # 8 features → C(8, 2) = 28 unordered pairs per polynomial family.
  nbest_neurons: 8
  max_neuron_models: 56
  # After StandardScaler the per-feature range is roughly ±3 σ, so the
  # worst-case |xi*xj| at xavier init is ~9. 1e+4 is plenty of headroom
  # without ever binding the clamp inside the regular operating range.
  output_clamp_value: 1.0e+4

  # A Linear(num_out, 1) head on top of the survivor pool, off as shipped.
  # When on, `train_out_proj` (called by `concrete.py` after
  # `trainer.train`) fits it against NormMSE. `num_out_neurons` is the size of
  # the last-layer survivor pool the head consumes — top-k by err_values,
  # zero-padded if fewer survived. nbest_neurons = num_out_neurons means
  # the head sees the full survivor width.
  use_output_projection: False
  num_out_neurons: 8

# --- Training ----------------------------------------------------------------
train:
  seed: 10
  # Larger than the 659 training rows, so every LBFGS step sees the whole
  # training split, which keeps its curvature pairs consistent.
  batch_size: 8192
  device: cpu
  dtype: float32

  criterion_type: validate
  error_alpha: 0.5
  layer_err_criterion: top
  criterion_minimum_width: 2
  stop_train_epsilon_condition: 0.001
  # A high cap: the growth rule above decides the depth. As shipped it
  # trains 32 layers and keeps 30 (two CPU runs, 2026-10-04, test RMSE
  # 5.37 MPa).
  max_layer_count: 50

  # Decorrelated survivors: a candidate is kept only if at least 20 % of its
  # centered norm on dev survives Gram-Schmidt against the survivors kept
  # so far.
  neuron_selection_method: omp_mixed
  neuron_selection_orth_threshold: 0.2

  # L2 (ridge) penalty on each neuron's polynomial coefficient fit.
  # PolyQuadratic(dim=5) has 1 + 5 + 5·6/2 = 21 weights per neuron, fitted
  # on 659 training rows, so a small penalty keeps the highest-arity
  # family from overfitting. Tune it with a Hydra multirun:
  #   python -m tutorials.concrete.concrete -m train.ridge_alpha=0.0001,0.001,0.01
  # and compare the dev errors in each run's log (the `Layer #k: error`
  # lines). The criterion that scores candidates on dev is unpenalized
  # (`eval_loss_fn_vmapped` is pinned to alpha=0), so the runs compare
  # like with like.
  ridge_alpha: 0.001

  # LBFGS — convex weight fit per neuron-model.
  optimizer:
    name: lbfgs
    verbose: True
    optimizer_params:
      lr: 1e-1
      min_lr: 1e-2
      gamma: 0.5
      history_size: 10
      clip_norm: 5.0
  steps: 500
  shuffle: True

  eval_step_interval: 5
  eval_smoothing_factor: 0.2
  early_stop_tolerance_steps: 3
  early_stop_patience: 1e-3
  early_stop_completion_percentage: 100
  train_loss_tol: 0.001
  train_loss_window: 20

  # Checkpointing — local to the tutorial folder so artifacts don't collide
  # with the other tutorials.
  save_interval: 500
  save_last_layer: True
  keep_last_n: 5
  skip_saving_at_epoch_end: True
  checkpoint_dir: "../concrete/checkpoints"

  # Per-layer joint fine-tune, off: after selection on every layer, the
  # surviving neurons' coefficients and a temporary (d_layer, 1) head train
  # together against NormMSE on the training split, with an early stop on
  # dev. Uses out_proj_train's hyperparameters (below) so both passes share
  # one place to tune.
  layer_finetune: False

  # Fits the regression out_proj head (Linear(num_out, 1)) against NormMSE
  # on the training split, with an early stop on dev, when
  # use_output_projection is on. LBFGS is appropriate because the fit is a
  # convex linear regression on top of the frozen survivor outputs —
  # converges in O(50–200) outer steps.
  out_proj_train:
    optimizer: lbfgs
    max_steps: 200
    lr: 0.1                # LBFGS step length; strong_wolfe scales it
    weight_decay: 1.0e-4   # mild L2 on the (D, 1) head
    eval_interval: 5
    lr_patience: 5
    lr_factor: 0.5
    lr_min: 1.0e-5
    early_stop_patience: 10
    early_stop_min_delta: 1.0e-5
    lbfgs_history_size: 20
    lbfgs_max_iter: 20
    lbfgs_line_search: strong_wolfe
