# california_housing_legendre.yaml + a linear output head over the last
# layer's survivors (`model.use_output_projection`) and a final end-to-end
# fine-tune of the whole network (`finetune_end_to_end`). Same family, same
# candidate cap and seed as that config; the head, the end-to-end pass and a
# wider survivor pool (16 vs 8) are the differences. Recipe adapted from
# tutorials/ccpp/ccpp_legendre_poly_finetune.yaml, where the notes on every
# knob live - with one deliberate departure: the per-layer joint fine-tune
# (`train.layer_finetune`) is OFF here, see the note at that key.
#
# Run from the tutorial folder:
#     python california_housing.py --config-name california_housing_legendre_finetune
# or from the repo root:
#     python -m tutorials.california_housing.california_housing --config-name california_housing_legendre_finetune
# On a CUDA machine (the candidate fits are the part that speeds up):
#     python california_housing.py --config-name california_housing_legendre_finetune train.device=cuda
#
# Baseline for this file is california_housing_legendre.yaml:
#   test MSE 0.3484   MAE 0.4184   (random 50/50 split, seed 42, 9 layers)
#
# Results of this file, end-to-end lr 1e-4, by the script's input / target
# switches (log_features / log_target / clip_predictions; single split, so
# differences under ~0.01 are within seed noise):
#   raw feats, raw target, no clip     MSE 0.3027   MAE 0.3789
#   raw feats, raw target, clip        MSE 0.3002   MAE 0.3758
#   raw feats, log target, clip        MSE 0.3164   MAE 0.3789
#   log feats, raw target, clip        MSE 0.3191   MAE 0.3872
#   log feats, log target, clip        MSE 0.3013   MAE 0.3626
# + location_features (rotated coords, city distances, kNN price), cuda:
#   cap 70                             MSE 0.2630   MAE 0.3344
#   cap 140                            MSE 0.2605   MAE 0.3307
# The kNN price feature carries most of it: layer-0 error 0.185 vs 0.42
# without it, and the search now keeps 1-3 layers.
# Split 60/20/20 (test_size 0.2, sqMode4_1; 12384 train rows), batch 16384:
#   cap 140, cuda                      MSE 0.2160   MAE 0.2975   (5 layers trained)
# Fair comparison on the same 4128 test rows: the 25/25/50 model above scores
# MSE 0.2650 / MAE 0.3334 there, so ~0.05 MSE of the gain is the extra data.
# Depth experiments on top of that row (see the layer_finetune note below):
#   criterion_minimum_width 4, eps 1e-4  MSE 0.2109   MAE 0.2925   (13 layers)
#   layer_finetune off                   MSE 0.2048   MAE 0.2857   (14 layers)
#   nbest / num_out 16                   MSE 0.2102   MAE 0.2893   (4 layers)
#   layer_finetune off + 16 survivors    MSE 0.1986   MAE 0.2803   (15 layers) <- this file
#   (rerun of this file as written: MSE 0.1972 / MAE 0.2786 - cuda runs are not
#   bit-reproducible, so that is the seed-noise scale for a single split)
# Legendre degree, on this file (single runs):
#   degree 4                             MSE 0.1969   MAE 0.2796   (16 layers)
#   degree 5                             MSE 0.2027   MAE 0.2810   (14 layers)
# Second family, 3-input Legendre (degree 3, squash) next to the pairs, cap 140
# so ~20% of the 680 layer-0 triplets are sampled (CLI override, not baked in):
#   pairs + dim-3 family                 MSE 0.1945   MAE 0.2798   (16 layers, 1.7x layer time)
#   same, cap 700 (all 680 triplets)     MSE 0.1944   MAE 0.2795   (12 layers, 7x layer time,
#                                        best layer error 0.148 vs 0.151 pairs-only)
# Ensemble of this file (tutorial.n_ensemble=5: seeds 10-14, members 2-5 on
# reshuffled train/dev rows, same 4128 test rows):
#   single members                       MSE 0.2010 +- 0.0021   MAE 0.2825 +- 0.0019
#   mean of the 5 predictions            MSE 0.1901             MAE 0.2740
# So +-0.002 is the seed/split noise of one run here; differences under ~0.005
# in the tables above are not resolvable from single runs.
# Growth criterion (train.layer_err_source), single model, cuda:
#   layer_finetune on, 'neuron' (old)     MSE 0.2102   MAE 0.2893   (4 trained / 3 kept)
#   layer_finetune on, 'readout'          MSE 0.2099   MAE 0.2876   (5 trained / 3 kept)
#   layer_finetune off (this file)        MSE 0.1972   MAE 0.2786   (15 layers)
#   layer_finetune off, 'readout' over the frozen survivors
#                                         MSE 0.2017   MAE 0.2810   (18 trained)
# Survivor selection (train.neuron_selection_method), single model, cuda:
#   plain (was the default here)          MSE 0.1972   MAE 0.2786   (15 layers)
#   omp_mixed                             MSE 0.1946   MAE 0.2731   (11 layers) <- this file
#   omp                                   MSE 0.1952   MAE 0.2786   (10 layers)
#   omp_mixed + 'readout' criterion       MSE 0.2015   MAE 0.2826   (7 layers: the
#     readout curve is flatter, so that criterion stops too early; the head-vs-
#     best-neuron gap did widen as predicted, 0.007 vs 0.002 under plain)
# Feature audit fixes in the script (log MedInc; AveBedrms column replaced by
# log bedrooms-per-room, which is the same information at skew 0.5 instead of 6;
# rows clipped at +-5 sigma on that column 95 -> 5), omp_mixed, single model:
#   fixed features                        MSE 0.1920   MAE 0.2740   (7 layers)
# Censored loss (train.censor_target_at = log cap; tutorial.censor_cap), single model:
#   + censoring                           MSE 0.1912   MAE 0.2719   (15 layers) <- current
#   No real effect: the model predicts BELOW the cap on most capped rows (mean 4.23,
#   45 of 184 at the cap), and censoring only changes rows predicted above it. The
#   capped rows still carry 24% of the test MSE and the uncapped 4-5 rows are still
#   under-predicted by 0.72: the top of the market is shrunk toward the mean, not
#   dragged down by the cap. Kept on as the correct loss for the data.
# Yardstick: sklearn HistGradientBoosting on the same 16 features, split and
# prediction clip (tmp/gbm_baseline.py recipe: lr 0.05, 31 leaves, l2 1, early
# stop on 15% of train):
#   single, log target                    MSE 0.1831   MAE 0.2673
#   single, raw target                    MSE 0.1700   MAE 0.2644
#   single, log target, no kNN feature    MSE 0.1980   MAE 0.2775
#   mean of 5 seeds, log target           MSE 0.1727   MAE 0.2589
# vs SONN single 0.1912 / ensemble 0.1901: ~0.02 MSE (10%) of headroom remains
# with this feature set, and the trees prefer the raw target for MSE.
# Raw target (tutorial.log_target=false, cap in price units), single model:
#   raw target                            MSE 0.1877   MAE 0.2791   (9 layers) <- current
#   same, LBFGS with the curvature condition and step cap (optimizer defaults
#   since 2026-09-30; 0.1% of updates capped, no pair rejected, same 81-step
#   fits and layer curve)                  MSE 0.1884   MAE 0.2772   (9 layers)
#   same, LBFGS with the batched two-loop recursion (2026-09-30; 3-5 s per
#   layer instead of 24-30, same 81-step fits, layer curve identical to three
#   decimals through layer 8, then the growth criterion runs two layers
#   further on a 0.001 dev difference and the end-to-end pass stops earlier):
#     three runs, 11 layers each          MSE 0.1932-0.1938   MAE 0.282
#     train.max_layer_count=9             MSE 0.1907   MAE 0.2817
#   The 0.003-0.005 spread between these and the rows above is the two
#   dev-driven stop rules reacting to 1e-4-level rounding differences, not
#   seed noise (the three repeats agree to 0.0006).
#   Growth rule with train.stop_train_min_delta 0.002 and width 3 (this file
#   since 2026-09-30; a layer improves when it lowers the last accepted
#   improvement by 0.002, stop after 3 layers without one):
#     three runs, 10 layers each        MSE 0.1882-0.1884   MAE 0.2795 <- current
#   Same curve, same depth, same number every time; the rule no longer
#   decides on rounding. +-0.002 is again the resolution of a single run.
#   + candidate early stop on the training loss (train.early_stop_source=train,
#   CLI override, 2026-09-30), three runs:
#     8 layers each                       MSE 0.1891-0.1894   MAE 0.2794
#   Same 81-step fits, a curve 0.001 off the dev-stopped one at layers 3-6,
#   two layers shallower, 0.001 above it on test (inside noise): the dev
#   split was not doing anything for an 8-parameter convex fit.
#   + a 10% validation split (tutorial.val_split=0.1; 11145 training rows), same
#   candidate stop, three runs each:
#     reported only                       MSE 0.1949-0.1950   MAE 0.2844   (6 layers)
#     train.stop_source=val               MSE 0.2054-0.2055   MAE 0.2943   (7 layers)
#   The rows taken from the fits cost 0.006; stop decisions on the 1239-row
#   split cost another 0.010. Val sits ~0.012 below dev at layer 0 and 0.003
#   at the end (different random subsets, the val rows are easier); the gap
#   narrows with depth. tutorial.val_split is 0 by default.
#   + end-to-end pass as a captured CUDA graph (finetune_train.cuda_graph,
#   default since 2026-09-30), candidate stop on train, three runs:
#     8 layers each                       MSE 0.1891-0.1894   MAE 0.2793
#   Same numbers as the eager pass; the pass takes 10 s instead of 60-80, a
#   whole run about 90 s on the GPU.
# 24 survivors / 24-wide head (this file since 2026-10-01; found by the
# overnight sweep, experiments/overnight_2026-09-30.md), candidate stop on
# train, seeds 10-13:
#   16 survivors (the rows above)        MSE 0.1890 +- 0.0031   MAE 0.2793
#   24 survivors                         MSE 0.1852 +- 0.0008   MAE 0.2775 <- current
#   (seed 10 alone: 0.1841 / 0.2762; 9, 9, 10, 7 layers)
#   Timing of a whole run of this file, RTX 5080, 2026-10-04: 38-39 s as
#   shipped (candidate stop on dev, 4 layers kept, MSE 0.1867-0.1872); 46 s
#   with train.early_stop_source=train as above (6 layers kept, MSE 0.1843).
#   The "about 90 s" further up was the 16-survivor file of 2026-09-30.
# The one change in this project that moved the number beyond the seed
# noise: -0.004 on every seed, and a quarter of the seed spread. 32
# survivors give the same mean (0.1851) with a wider spread; 48 lose.
#   (log target, same pipeline           MSE 0.1912   MAE 0.2719   (15 layers))
# MSE-optimal is the conditional mean, which the raw target estimates; the log
# target estimates the median and wins MAE. The end-to-end pass needed 10875
# steps here vs ~2000-4000 on the log target.
# Config-only variants on top of that row (single model, cuda), none kept:
#   32 survivors / 32-wide head, cap 300  MSE 0.1904   MAE 0.2832   (6 layers, 104 s/layer)
#   tanh neuron activation                MSE 0.2191   MAE 0.3081   (layer error 1.87: a
#     bounded output cannot reach a raw target that runs to 5; only meaningful with a
#     standardized target, which the script does not do)
#   use_layer_norm                        MSE 0.2096   MAE 0.2998   (layer errors rise
#     after layer 0, 0.194 -> 0.241: the norm re-scales the shortcut inputs the
#     later layers' neurons were calibrated on)
# With 'readout' the criterion is fair to the fine-tune - it scores the per-layer
# head's dev loss (0.145 at layer 0 vs 0.171 for the best neuron) - and still
# stops at 3 layers: the head's dev error plateaus at 0.144 from layer 0 on,
# so on this data the per-layer fine-tune genuinely does not gain from depth,
# whereas calibrated growth compounds over 15 layers. The criterion was not the
# reason it lost; it stays off here.
# Over frozen (calibrated) survivors the readout criterion grows to 18 layers and
# lands inside the single-run noise of the default (members 0.2010 +- 0.0021), so
# the depth was already right. Diagnostic worth keeping: a linear head over the 16
# calibrated survivors beats the best single neuron by only ~0.002 dev error
# (0.149 vs 0.151), against 0.026 with the fine-tune (0.145 vs 0.171) - the
# top-k survivors are near-duplicates, so the head has little to combine. That
# points at the selection rule (train.neuron_selection_method), not the depth.
#
# Compose against the SONNConfig schema first (filled-in defaults), then layer
# this tutorial's overrides on top via `_self_`. The schema is registered by
# `src/torchsonn/config/schemas.py` and exposed under the name `default`.
defaults:
  - default
  - _self_

# Top-level script knobs (overridable via Hydra CLI).
resume: false

# Tutorial-script knobs; tutorial_params() in california_housing.py documents
# every key; override on the CLI, e.g. tutorial.n_ensemble=5.
tutorial:
  test_size: 0.2
  dev_split: sqMode4_1
  val_split: 0.0
  n_ensemble: 1
  z_clip: 5.0
  feature_engineering: true
  log_features: true
  location_features: true
  knn_price_k: 20
  log_target: false
  clip_predictions: true
  censor_cap: true

# Final stage: after the structural search and the head fit, fine-tune every
# parameter in the network at once with Trainer.train_finetune, tuned by
# `train.finetune_train` at the bottom of this file. The head is kept and
# trained along with everything else, against exactly the readout report()
# scores.
finetune_end_to_end: true
finetune_drop_head: false
# Pruning to the read path first is a measured no-op for accuracy (off-path
# neurons have zero gradient); turn on to make the trained model and the
# rendered pruned plot the same object.
finetune_prune_first: false

# Disable Hydra's auto-chdir so the YAML's relative paths still resolve from
# the launch cwd rather than the per-run outputs/<date>/<time>/ dir.
hydra:
  job:
    chdir: false

model:
  type: regressor
  # Legendre-only variant of california_housing.yaml. Instead of the monomial
  # families (linear_cov / quadratic / polyquad) a single orthogonal-polynomial
  # basis over each input pair covers the linear, quadratic and cubic-curvature
  # terms in one well-conditioned family. Legendre neurons squash their inputs
  # into [-1, 1] first (model.squash_method: sigma, calibrated on the training
  # set), so the heavy-tailed housing features (AveRooms, AveBedrms, AveOccup,
  # Population) cannot drive the polynomial off the scale the way raw z-scores
  # do for the monomial neurons - the +-5 sigma clip in the script is a second
  # line of defence here rather than the only one.
  #
  # degree 3 -> 1 + 2*3 + 1 (cross term) = 8 coefficients per pair neuron.
  # Degrees 4 and 5 were measured on this file too. Single runs (the results
  # table) gave 0.1969 and 0.2027 against 0.1972; the README's seed repeats
  # put both within the seed noise of degree 3, so 3 stays, with the fewest
  # coefficients (10 at degree 4, 12 at degree 5).
  # Per-neuron-type activation: the entry sets its own `activation:`; an empty
  # string means None -> `nn.Identity()`.
  ref_functions:
    - legendre:
        degree: 3
        squash: True
        activation: ""
  # No shortcut keeps the architecture comparable to the gmdhpy example.
  shortcut: True
  # Linear(num_out_neurons, 1) head over the last layer's survivors. The plain
  # config reads the single best-error neuron instead; the head lets the
  # end-to-end pass optimize a combination of all survivors, which is what
  # makes that pass worth running. report() reads the head.
  use_output_projection: True
  # Keep equal to nbest_neurons so the head spans every survivor.
  num_out_neurons: 24
  # Survivors kept per layer = the basis the head combines, and (under
  # `shortcut`) part of the next layer's input. 16 vs 8 measured on this file:
  # MSE 0.2102 vs 0.2160 alone, 0.1986 vs 0.2048 with layer_finetune off.
  # 24 since 2026-10-01: the overnight sweep found a wider pool to be the one
  # robust gain (24 and 32 survivors beat 16 on four seeds each, by ~0.004
  # MSE; 48 does not), see experiments/overnight_2026-09-30.md.
  nbest_neurons: 24
  # Per-family cap on the candidate neurons built per layer. A family with more
  # input combinations than the cap gets a seeded random subset of them, so the
  # cap decides how exhaustive each layer is. The script feeds the model 16
  # features (8 raw/logged incl. the bedrooms ratio, 1 ratio, 7 location) ->
  # C(16, 2) = 120 pairs at layer 0, enumerated in full at 140. Deeper layers
  # are wider under `shortcut` (16 survivors + 16 inputs -> 496 pairs) and are
  # sampled; layer time scales
  # roughly with the candidate count. Measured on the finetune config: 140 vs
  # 70 gave MSE 0.2605 vs 0.2630, within noise, at ~1.6x the layer time.
  # (A second, 4-input Legendre family was tried on the 8 raw features: dev
  # error 0.269 vs 0.264 for pairs alone, at 7x the layer time, so dropped.)
  max_neuron_models: 140
  # StandardScaler keeps features z-scored but doesn't clip heavy tails, so
  # at xavier init the worst-case |xi*xj| on the Population/AveOccup outliers
  # reaches ~7300. Cap well above that so torch.clamp doesn't zero the
  # gradient through those samples in the first LBFGS steps.
  output_clamp_value: 1.0e+6

train:
  seed: 10
  # LBFGS curvature pairs (s, y) are only meaningful when the gradient is
  # stable — small mini-batches make them noisy. Bump the batch up to a near-
  # full-batch on the California train split (~10k samples) so each step
  # actually moves along a good Newton-like direction.
  # Above the 12384 train rows of the script's 60/20/20 split, so every LBFGS
  # step is a true full-batch step.
  batch_size: 16384
  device: cpu

  # gmdhpy defaults: criterion="validate", layer_err_criterion="top",
  # criterion_minimum_width=5, stop_train_epsilon_condition=0.001
  criterion_type: validate
  error_alpha: 0.5
  layer_err_criterion: top
  # Growth stop rule: a layer improves when it lowers the error of the last
  # accepted improvement by max(0.002, 0.001 x best); the search stops after
  # 3 consecutive layers without one. 0.002 is the dev evaluation's noise
  # floor here; with the old 0.001-relative margin (0.00017) alone, float32
  # summation order decided between 9 and 11 layers (2026-09-30).
  criterion_minimum_width: 3
  stop_train_epsilon_condition: 0.001
  stop_train_min_delta: 0.002
  max_layer_count: 50

  # Survivor selection. 'plain' keeps the top-16 candidates by individual dev
  # error, which on this data are near-duplicates of the same best pair (a head
  # over them beat the best single neuron by only 0.002 dev error). 'omp_mixed'
  # walks candidates in error order and drops any whose output is mostly
  # explained by the survivors already chosen (Gram-Schmidt on dev, keep if
  # >= 30% of the norm survives), so the head gets a decorrelated basis.
  # Measured, single model: plain 0.1972 / 0.2786 (15 layers), omp_mixed
  # 0.1946 / 0.2731 (11 layers), omp 0.1952 / 0.2786 (10 layers). The MSE gain
  # is at the edge of single-run noise (+-0.002); the MAE gain is ~3x it. Also
  # ~30% fewer layers. Not yet confirmed across seeds.
  neuron_selection_method: omp_mixed

  # Optimization — LBFGS is a quasi-Newton method that estimates the inverse
  # Hessian from a rolling history of (s = Δw, y = Δgrad) pairs. On a convex
  # 4-parameter MSE objective like a single linear_cov neuron it converges in
  # tens of iterations (essentially iterative closed-form). lr=1.0 is the standard LBFGS
  # step scale — the two-loop recursion already produces a Newton-ish step,
  # we're not rescaling it.
  optimizer:
    name: lbfgs
    verbose: True
    optimizer_params:
      lr: 1e-1
      min_lr: 1e-2
      gamma: 0.5
      history_size: 10
      clip_norm: 5.0
  steps: 500
  shuffle: True

  # Eval / early stop — eval every few LBFGS steps; with full-batch gradients
  # each step is a real Newton update so we want to react quickly.
  eval_step_interval: 5
  eval_smoothing_factor: 0.2
  early_stop_tolerance_steps: 3
  early_stop_patience: 1e-3
  early_stop_completion_percentage: 100

  # Checkpointing — keep the housing artefacts inside the tutorial folder so
  # they don't collide with the iris checkpoints in the repo's top-level dir.
  save_interval: 500
  save_last_layer: True
  keep_last_n: 5
  skip_saving_at_epoch_end: True
  checkpoint_dir: "../california_housing/checkpoint/${hydra:job.config_name}"

  # Per-layer joint fine-tune: OFF, unlike the CCPP recipe. When on, each
  # layer's survivors are re-trained jointly through a temporary head right
  # after selection, which turns them from calibrated predictors into a basis
  # for that head. The layer-growth criterion, however, scores every neuron on
  # its own dev error, so from the next layer on it sees decalibrated inputs,
  # the per-neuron errors get worse and the search stops after a few layers
  # (5 trained / 3 kept here, vs 14-15 with it off). Measured: off is better,
  # MSE 0.2048 vs 0.2160 at 8 survivors and 0.1986 vs 0.2102 at 16. The
  # end-to-end pass below does the joint optimization instead, once, over the
  # full calibrated network. Set True to get the CCPP recipe back.
  layer_finetune: False

  # Hyperparameters for the out_proj head fit (and for layer_finetune, if you
  # turn it on - the two passes share this block). LBFGS, full batch: the train
  # rows fit in one batch (see train.batch_size).
  out_proj_train:
    optimizer: lbfgs
    max_steps: 100
    lr: 0.1
    weight_decay: 1.0e-4
    eval_interval: 5
    early_stop_patience: 6
    early_stop_min_delta: 1.0e-5
    lr_patience: 5
    lr_factor: 0.5
    lr_min: 1.0e-5
    lbfgs_history_size: 20
    lbfgs_max_iter: 20
    lbfgs_line_search: strong_wolfe

  # Final stage: the end-to-end pass. Every weight moves at once, so it wants a far
  # gentler step than the per-layer refinements: AdamW at a tiny lr, decoupled
  # weight decay, ReduceLROnPlateau annealing below it. Each step is one
  # full-batch update. CHECK THE LOG for "finetune early stop": if it is
  # missing, the budget was binding and the number is truncated, not converged.
  finetune_train:
    optimizer: adamw
    # 1e-4, not the CCPP value of 1e-5: at 1e-5 the pass ran the whole 20000-step
    # budget still improving (dev 0.239, test MSE 0.3086) with the plateau
    # scheduler never firing, i.e. a truncated number rather than a converged one.
    # At 1e-4 it early-stopped at step 4075 after three lr halvings (dev 0.2348,
    # test MSE 0.3027 / MAE 0.3789) in 1.7 min.
    lr: 1.0e-4
    weight_decay: 1.0e-4
    max_steps: 20000
    eval_interval: 25
    early_stop_patience: 20
    early_stop_min_delta: 1.0e-6
    lr_patience: 5
    lr_factor: 0.5
    lr_min: 1.0e-8
