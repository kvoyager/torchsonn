[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsonn"
version = "0.1.2"
description = "Self-organizing polynomial neural network on PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Konstantin Kolokolov" },
]
requires-python = ">=3.12"
keywords = [
    "gmdh",
    "group-method-of-data-handling",
    "polynomial-neural-network",
    "pytorch",
    "self-organizing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "hydra-core>=1.3",
    "torch",
    "numpy",
    "scikit-learn",
    "tqdm",
    "omegaconf",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pandas",
    # test_plot_model.py imports torchsonn.plot_model; test_model.py exercises
    # SONN.plot_layer_error.
    "torchsonn[viz]",
]
# Plotting-only, and each reached from exactly one call site: `graphviz` from
# torchsonn.plot_model (an opt-in module), `matplotlib` from
# SONN.plot_layer_error (imported inside the method so the base install stays
# importable). graphviz is also inert without the system Graphviz binaries
# (`dot` on PATH) — a common install snag. Keeping both out of the base
# dependency set means a plain `pip install torchsonn` can't fail on them.
viz = [
    "graphviz",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/kvoyager/torchsonn"
Repository = "https://github.com/kvoyager/torchsonn"
Issues = "https://github.com/kvoyager/torchsonn/issues"

[tool.setuptools.packages.find]
where = ["src"]
# `where=["src"]` makes setuptools scan inside src/ instead of the project
# root, picking up `torchsonn` + every subpackage (config, data, loss,
# modules, neurons, optimizers, schedulers). Without this hint, auto-
# discovery falls back to flat-layout rules and errors out because tests/
# and tutorials/ also have __init__.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["torchsonn"]
omit = [
    "*/tutorials/*",
    "*/tests/*",
]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]